server {
    listen 80 default_server reuseport accept_filter=httpready;
    listen [::]:80 default_server reuseport accept_filter=httpready;
    server_name _;
    location / {
        return 308 https://$host$request_uri;
    }
}
server {
    listen 443 default_server ssl reuseport accept_filter=dataready so_keepalive=60s:10s:3;
    listen [::]:443 default_server ssl reuseport accept_filter=dataready so_keepalive=60s:10s:3;
    http2 on;
    server_name _;
    ssl_certificate cert/host-default.crt;
    ssl_certificate_key cert/host-default.key;
    add_header InheritRoot0 true;
    return 444;
}
